<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Courant{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" sizes="any">

  <!-- Tailwind for utility classes still in use elsewhere -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts : Fraunces for display, Inter for UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Courant cozy stylesheet -->
  <link rel="stylesheet" href="/static/courant.css">

  <!-- HTMX for interactivity -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="scene-dark"
      data-scene="{{ current_scene or 'cozy-cabin' }}">
  <video id="scene-video"
         autoplay loop muted playsinline
         poster=""
         class="scene-video"></video>

  <div id="audio-player" class="audio-player" aria-label="Ambient audio player">
    <audio id="audio-element" loop preload="none"></audio>

    <div class="audio-art" aria-hidden="true">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="audio-art-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3b3470"/>
            <stop offset="55%" stop-color="#7a4a8f"/>
            <stop offset="100%" stop-color="#d99a6c"/>
          </linearGradient>
        </defs>
        <rect width="48" height="48" rx="6" fill="url(#audio-art-grad)"/>
        <path d="M24 10 C 18 18, 16 24, 20 30 C 24 36, 28 34, 28 28 C 28 24, 26 20, 24 10 Z"
              fill="rgba(255,255,255,0.92)"/>
      </svg>
    </div>

    <div class="audio-meta">
      <span id="audio-track-title" class="audio-track-title">Lofi</span>
      <span id="audio-track-artist" class="audio-track-artist">Courant ambient</span>
    </div>

    <div class="audio-controls">
      <button id="audio-prev" class="audio-control" type="button" aria-label="Previous track">
        <svg class="audio-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
        </svg>
      </button>
      <button id="audio-toggle" class="audio-control audio-toggle" type="button" aria-label="Play ambient audio">
        <svg class="audio-icon icon-play" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg class="audio-icon icon-pause" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 4h4v16H6zM14 4h4v16h-4z"/>
        </svg>
      </button>
      <button id="audio-next" class="audio-control" type="button" aria-label="Next track">
        <svg class="audio-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/>
        </svg>
      </button>
    </div>
  </div>

  <nav class="cozy-nav">
    <a href="/" class="brand">Courant</a>
    <div class="flex gap-6 text-sm">
      <a href="/">Dashboard</a>
      <a href="/reminders">Reminders</a>
      <a href="/stats">Stats</a>
      <a href="/settings">Settings</a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/scene-loader.js"></script>
  <script src="/static/audio-player.js"></script>
  <script>
    // Reload the page right after midnight so tracked-reminder counters
    // reset their displayed value to 0 for the new day. The underlying
    // query already filters by today's range; this just keeps a long-open
    // tab in sync without the user having to refresh manually.
    (function scheduleMidnightReload() {
      const now = new Date();
      const nextMidnight = new Date(
        now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5
      );
      setTimeout(() => location.reload(), nextMidnight - now);
    })();

    // Fill any [data-locale-date] element with today's day + date + time
    // in the user's browser locale (navigator.language). Reads naturally as
    // "Monday, May 25, 2026, 06:23 PM" or "lundi 25 mai 2026, 18:23".
    // Refreshes every minute so the clock stays accurate.
    (function renderLocaleDate() {
      const targets = document.querySelectorAll('[data-locale-date]');
      if (targets.length === 0) return;
      const locale = (navigator.languages && navigator.languages[0]) || navigator.language || 'en-US';
      const fmt = new Intl.DateTimeFormat(locale, {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
        hour: '2-digit', minute: '2-digit',
      });
      function tick() {
        const text = fmt.format(new Date());
        targets.forEach((el) => { el.textContent = text; });
      }
      tick();
      setInterval(tick, 60000);
    })();
  </script>
</body>
</html>
