<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Courant{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

  <!-- Tailwind for utility classes still in use elsewhere -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts : Fraunces for display, Inter for UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Courant cozy stylesheet -->
  <link rel="stylesheet" href="/static/courant.css">

  <!-- HTMX for interactivity -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="scene-dark"
      data-scene="{{ current_scene or 'cozy-cabin' }}">
  <video id="scene-video"
         autoplay loop muted playsinline
         poster=""
         class="scene-video"></video>

  <div id="audio-player" class="audio-player">
    <audio id="audio-element" loop preload="none"></audio>
    <button id="audio-toggle" class="audio-toggle" aria-label="Play/pause ambient audio">
      ♪
    </button>
    <span id="audio-track-name" class="audio-track-name">—</span>
    <select id="audio-select" class="cozy-select audio-select" aria-label="Select audio track">
      <option value="">Silence</option>
      <!-- options populated by JS from /api/audio -->
    </select>
    <input id="audio-volume" type="range" min="0" max="100" value="50"
           class="audio-volume" aria-label="Volume">
  </div>

  <nav class="cozy-nav">
    <a href="/" class="brand">Courant</a>
    <div class="flex gap-6 text-sm">
      <a href="/">Dashboard</a>
      <a href="/reminders">Reminders</a>
      <a href="/stats">Stats</a>
      <a href="/settings">Settings</a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/scene-loader.js"></script>
  <script src="/static/audio-player.js"></script>
  <script>
    // Reload the page right after midnight so tracked-reminder counters
    // reset their displayed value to 0 for the new day. The underlying
    // query already filters by today's range; this just keeps a long-open
    // tab in sync without the user having to refresh manually.
    (function scheduleMidnightReload() {
      const now = new Date();
      const nextMidnight = new Date(
        now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5
      );
      setTimeout(() => location.reload(), nextMidnight - now);
    })();
  </script>
</body>
</html>
