[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "courant"
version = "0.1.1"
description = "A cozy reminder for developers — drink water, rest your eyes, stretch."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Bryan Chen", email = "bryan.chen@wingleet.com" },
]
keywords = ["reminder", "linux", "desktop", "notifications", "wellness", "lofi", "cozy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "apscheduler>=3.10",
    "desktop-notifier>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage      = "https://github.com/BryanBradfo/courant"
Issues        = "https://github.com/BryanBradfo/courant/issues"
Documentation = "https://github.com/BryanBradfo/courant#readme"
Source        = "https://github.com/BryanBradfo/courant"
Changelog     = "https://github.com/BryanBradfo/courant/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
courant = "courant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["courant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
